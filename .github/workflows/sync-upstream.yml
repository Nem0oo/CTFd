name: Sync from upstream

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *" # tous les jours à minuit UTC
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Add upstream remote
        run: git remote add upstream https://github.com/CTFd/CTFd.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Merge upstream changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout master
          git merge --strategy=recursive --strategy-option=theirs upstream/master || true
          # Restaure ton .github tel qu'il est dans ta branche (évite l'écrasement)
          git restore --source=origin/master --staged --worktree .github/workflows/build.yml
          git restore --source=origin/master --staged --worktree .github/workflows/sync-upstream.yml
          git restore --source=origin/master --staged --worktree .dockerignore
          
          if ! git diff --cached --quiet; then
            git commit -m "Sync upstream without overwriting .github"
          else
            echo "No changes to commit locally (fast-forward or only ignored files)"
          fi

          git push origin master
